<header class="ops-bar card">
  <div class="ops-brand">
    <span class="ops-mark" aria-hidden="true">M/</span>
    <div class="ops-brand-copy">
      <span>Search control plane</span>
      <h1>MySearch Proxy</h1>
    </div>
  </div>

  <div class="ops-current" id="hero-focus" aria-live="polite">
    <span class="hero-focus-signal is-idle" id="hero-focus-signal" aria-hidden="true"></span>
    <div class="ops-current-copy">
      <span class="hero-focus-kicker">当前工作台</span>
      <strong class="hero-focus-name">Tavily</strong>
    </div>
    <span class="hero-focus-status is-idle">等待状态</span>
    <span class="hero-focus-stamp" id="hero-focus-stamp">等待刷新</span>
    <p class="hero-focus-desc sr-only">正在读取当前工作台状态。</p>
  </div>

  <div class="ops-actions">
    <button class="user-btn ops-access-btn" type="button" onclick="window.location.href='/mysearch'" aria-label="打开 MySearch 接入台">
      <span class="action-label-wide">MySearch 接入</span>
      <span class="action-label-compact" aria-hidden="true">接入</span>
    </button>
    {% include 'components/_topbar_actions.html' %}
  </div>
</header>
