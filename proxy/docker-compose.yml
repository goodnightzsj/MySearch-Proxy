services:
  mysearch-proxy:
    build: .
    ports:
      - "9874:9874"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD to a strong value}
      - MYSEARCH_PROXY_DB_PATH=/data/proxy.db
      - MYSEARCH_PROXY_KEY_UPLOAD_TOKEN=${MYSEARCH_PROXY_KEY_UPLOAD_TOKEN:-}
      - SOCIAL_GATEWAY_LOCAL_BASE_URL=${SOCIAL_GATEWAY_LOCAL_BASE_URL:-https://api.x.ai/v1}
      - SOCIAL_GATEWAY_LOCAL_RESPONSES_PATH=${SOCIAL_GATEWAY_LOCAL_RESPONSES_PATH:-/responses}
      - SOCIAL_GATEWAY_LOCAL_API_KEY=${SOCIAL_GATEWAY_LOCAL_API_KEY:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
